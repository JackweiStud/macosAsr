name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift compile + self-test
        run: ./scripts/test_p0c.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python smoke (imports, no model)
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from asr.config import AsrConfig; c=AsrConfig(); assert c.partial_interval_seconds == 0.5"
          python -m asr_daemon --help
